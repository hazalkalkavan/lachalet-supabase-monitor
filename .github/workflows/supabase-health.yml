name: Supabase daily health check

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update database heartbeat
        env:
          HEARTBEAT_TOKEN: ${{ secrets.HEARTBEAT_TOKEN }}
        run: |
          test -n "$HEARTBEAT_TOKEN"

          curl --fail --silent --show-error \
            --retry 2 \
            --max-time 30 \
            --request POST \
            --header "Content-Type: application/json" \
            --header "x-heartbeat-token: $HEARTBEAT_TOKEN" \
            --data '{}' \
            "https://ccyxwckxbbwwmnootfkq.supabase.co/functions/v1/supabase-heartbeat"

          echo "Database heartbeat completed"
