name: Supabase daily health check

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/supabase-health.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update database heartbeat
        env:
          HEARTBEAT_TOKEN: ${{ secrets.HEARTBEAT_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.request
          import urllib.error

          token = os.environ.get("HEARTBEAT_TOKEN", "").strip()
          if not token:
              raise SystemExit("HEARTBEAT_TOKEN secret is missing or empty")

          url = "https://ccyxwckxbbwwmnootfkq.supabase.co/functions/v1/supabase-heartbeat"
          request = urllib.request.Request(
              url,
              data=b"{}",
              headers={
                  "Content-Type": "application/json",
                  "x-heartbeat-token": token,
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print("Heartbeat HTTP status:", response.status)
                  print("Database heartbeat completed")
          except urllib.error.HTTPError as error:
              print("Heartbeat HTTP status:", error.code)
              print("Server response:", error.read(500).decode("utf-8", "replace"))
              raise SystemExit(1)
          except Exception as error:
              print("Heartbeat request failed:", type(error).__name__, str(error))
              raise SystemExit(1)
          PY
