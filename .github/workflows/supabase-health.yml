name: Supabase daily health check

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Supabase endpoint
        env:
          HEALTH_URL: ${{ secrets.SUPABASE_HEALTH_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$HEALTH_URL"
          test -n "$SUPABASE_KEY"
          curl --fail --silent --show-error \
            --retry 2 \
            --max-time 30 \
            -H "apikey: $SUPABASE_KEY" \
            "$HEALTH_URL"
          echo "Supabase endpoint check completed"
